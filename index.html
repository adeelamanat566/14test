<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

        <h1>User Management</h1>

        <form action="/add" method="POST">

            <button type="submit">User dddaddiction yes new one</button>

            {% endfor %}
        </ul>

    </div>

</body>
</html>
